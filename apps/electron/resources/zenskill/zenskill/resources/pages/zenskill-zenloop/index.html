<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenLoop 循环</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-2: #6b7280;
    --muted: #9ca3af;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.10);
    --accent-fill: rgba(124, 92, 255, 0.18);
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --gold: #d97706;
    --gold-soft: rgba(217, 119, 6, 0.10);
    --gold-border: rgba(217, 119, 6, 0.32);
    --ring-track: #e9ebef;
    --cell-off: #e9ebef;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --rel-prerequisite: #d97706;
    --rel-complementary: #16a34a;
    --rel-competing: #dc2626;
    --rel-transfer: #9333ea;
    --rel-co-occurrence: #2563eb;
    --cat-coding: #2563eb;
    --cat-writing: #9333ea;
    --cat-analysis: #16a34a;
    --cat-learning: #d97706;
    --cat-productivity: #0d9488;
    --cat-communication: #ea580c;
    --cat-general: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d24;
      --card: #232730;
      --border: #333845;
      --text: #e5e7eb;
      --text-2: #9ca3af;
      --muted: #6b7280;
      --accent: #8b7cff;
      --accent-soft: rgba(139, 124, 255, 0.16);
      --accent-fill: rgba(139, 124, 255, 0.25);
      --good: #9ece6a;
      --warn: #e0af68;
      --bad: #f7768e;
      --gold: #e0af68;
      --gold-soft: rgba(224, 175, 104, 0.12);
      --gold-border: rgba(224, 175, 104, 0.35);
      --ring-track: #333845;
      --cell-off: #2d3240;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
      --rel-prerequisite: #e0af68;
      --rel-complementary: #9ece6a;
      --rel-competing: #f7768e;
      --rel-transfer: #bb9af7;
      --rel-co-occurrence: #7aa2f7;
      --cat-coding: #7aa2f7;
      --cat-writing: #bb9af7;
      --cat-analysis: #9ece6a;
      --cat-learning: #e0af68;
      --cat-productivity: #4fd6be;
      --cat-communication: #ff9e64;
      --cat-general: #7c8598;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 20px;
    min-height: 100vh;
  }
  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  /* 宿主顶栏已有页名，托管渲染时隐藏页内大标题 */
  .in-host .header h1 { display: none; }
  .updated { font-size: 12px; color: var(--text-2); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    margin-bottom: 12px; letter-spacing: 1px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .card h2 .en {
    font-size: 11px; color: var(--muted); letter-spacing: 0; margin-left: 4px;
  }
  .card h2 .count {
    font-size: 11px; color: var(--accent);
    background: var(--accent-soft); border-radius: 8px; padding: 1px 8px;
  }
  .card.wide { grid-column: 1 / -1; }
  .footer {
    margin-top: 16px; text-align: center;
    font-size: 11px; color: var(--muted);
  }
  /* 空态：图标 + 一句话 + 数据来源提示（空卡加高留白，内容区最小高垂直居中） */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 24px 12px; text-align: center;
  }
  .empty .empty-icon { font-size: 24px; line-height: 1; color: var(--muted); }
  .empty .empty-msg { font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .empty .empty-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .channel-body {
    min-height: 112px;
    display: flex; flex-direction: column; justify-content: center;
  }
  /* 循环概览 */
  .summary { font-size: 14px; color: var(--text); line-height: 1.6; }
  .sub { font-size: 12px; color: var(--text-2); margin-top: 6px; line-height: 1.6; }
  .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    font-size: 11px; color: var(--text-2);
    background: var(--accent-soft); border-radius: 8px; padding: 3px 10px;
  }
  .chip b { color: var(--accent); font-weight: 600; }
  /* 通道条目 */
  .item { margin-bottom: 12px; }
  .item:last-child { margin-bottom: 0; }
  .item-head { display: flex; align-items: baseline; gap: 10px; }
  .item-head .concept {
    flex: 1; font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-head .pct { font-size: 12px; color: var(--accent); font-weight: 600; }
  .bar {
    height: 6px; background: var(--accent-soft); border-radius: 3px;
    margin-top: 4px; overflow: hidden;
  }
  .bar .fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.4s ease;
  }
  .bar .fill.mature { background: var(--good); }
  .check { font-size: 11px; color: var(--text-2); margin-top: 4px; }
</style>
</head>
<body>
  <div class="header">
    <h1>ZenLoop 循环</h1>
    <span class="updated" id="updated"></span>
  </div>

  <div class="card wide">
    <h2>循环概览</h2>
    <div class="summary" id="summary">等待数据…</div>
    <div class="sub" id="review-message"></div>
    <div class="stat-chips" id="stat-chips"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>反思 <span class="en">reflect</span><span class="count" id="cnt-reflect">0</span></h2>
      <div id="ch-reflect" class="channel-body"></div>
    </div>
    <div class="card">
      <h2>整合 <span class="en">consolidate</span><span class="count" id="cnt-consolidate">0</span></h2>
      <div id="ch-consolidate" class="channel-body"></div>
    </div>
    <div class="card">
      <h2>洞察 <span class="en">insight</span><span class="count" id="cnt-insight">0</span></h2>
      <div id="ch-insight" class="channel-body"></div>
    </div>
    <div class="card">
      <h2>净化 <span class="en">purify</span><span class="count" id="cnt-purify">0</span></h2>
      <div id="ch-purify" class="channel-body"></div>
    </div>
  </div>

  <div class="footer">ZenSkill · 每小时自动刷新</div>

<script>
(function () {
  'use strict';

  // lucide 图标内联数据（stroke currentColor 1.75，path 数据取自 lucide）
  var ICON_PATHS = {
    brain: '<path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/>',
    puzzle: '<path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/>',
    lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
    'refresh-cw': '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
  };

  function icon(name, size) {
    size = size || 20;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block">' + (ICON_PATHS[name] || '') + '</svg>';
  }

  var CHANNELS = ['reflect', 'consolidate', 'insight', 'purify'];
  // 空通道引导文案：图标 + 一句话 + 数据来源提示
  var CHANNEL_EMPTY = {
    reflect:     { icon: 'brain', msg: '反思池空空如也', hint: 'ZenLoop 每小时自动运行，新的反思条目会出现在这里' },
    consolidate: { icon: 'puzzle', msg: '整合池空空如也', hint: 'ZenLoop 每小时自动运行，反思沉淀后进入这里' },
    insight:     { icon: 'lightbulb', msg: '洞察池空空如也', hint: 'ZenLoop 每小时自动运行，成熟想法会提炼成洞察' },
    purify:      { icon: 'leaf', msg: '净化池空空如也', hint: 'ZenLoop 每小时自动运行，过时概念会被回收净化' }
  };

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text == null ? '-' : String(text);
  }

  function showEmpty(container, iconName, message, hint) {
    container.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'empty';
    var ic = document.createElement('div');
    ic.className = 'empty-icon';
    ic.innerHTML = icon(iconName || 'inbox', 24);
    var msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = message || '暂无数据';
    el.appendChild(ic);
    el.appendChild(msg);
    if (hint) {
      var hp = document.createElement('div');
      hp.className = 'empty-hint';
      hp.textContent = hint;
      el.appendChild(hp);
    }
    container.appendChild(el);
  }

  function fmtTime(ms) {
    try {
      var d = new Date(ms);
      return d.toLocaleDateString('zh-CN') + ' ' +
        d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  // ---------- 循环概览 ----------
  function renderOverview(kv) {
    var summaryEl = document.getElementById('summary');
    if (kv.summary) {
      summaryEl.textContent = kv.summary;
    } else {
      showEmpty(summaryEl, 'refresh-cw', '暂无循环数据', 'ZenSkill 运行后 ZenLoop 会自动开始循环');
    }
    setText('review-message', kv.review_message || '');

    var chips = document.getElementById('stat-chips');
    chips.innerHTML = '';
    var stats = kv.loop_stats;
    if (stats && stats.active != null) {
      var active = document.createElement('span');
      active.className = 'chip';
      active.innerHTML = '活跃条目 <b></b>';
      active.querySelector('b').textContent = stats.active;
      chips.appendChild(active);
      var by = stats.by_channel || {};
      CHANNELS.forEach(function (ch) {
        if (by[ch] == null) return;
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = ' <b></b>';
        chip.insertBefore(document.createTextNode(ch), chip.querySelector('b'));
        chip.querySelector('b').textContent = by[ch];
        chips.appendChild(chip);
      });
    }
  }

  // ---------- 四通道条目 ----------
  function renderChannel(channel, items) {
    var box = document.getElementById('ch-' + channel);
    setText('cnt-' + channel, items ? items.length : 0);
    box.innerHTML = '';
    if (!items || !items.length) {
      var empty = CHANNEL_EMPTY[channel] || {};
      showEmpty(box, empty.icon, empty.msg || '暂无条目', empty.hint);
      return;
    }
    items.forEach(function (it) {
      var maturity = Math.max(0, Math.min(100,
        (it.maturity == null ? 0 : it.maturity) * 100));

      var item = document.createElement('div');
      item.className = 'item';

      var head = document.createElement('div');
      head.className = 'item-head';
      var concept = document.createElement('span');
      concept.className = 'concept';
      concept.textContent = it.concept || '（无内容）';
      concept.title = it.concept || '';
      var pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = maturity.toFixed(0) + '%';
      head.appendChild(concept);
      head.appendChild(pct);
      item.appendChild(head);

      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('div');
      fill.className = 'fill' + (maturity >= 80 ? ' mature' : '');
      fill.style.width = maturity.toFixed(1) + '%';
      bar.appendChild(fill);
      item.appendChild(bar);

      var check = document.createElement('div');
      check.className = 'check';
      check.textContent = it.check_after
        ? '建议检查 ' + it.check_after
        : '建议检查日未设置';
      item.appendChild(check);

      box.appendChild(item);
    });
  }

  function applySnapshot(snapshot) {
    if (!snapshot || typeof snapshot !== 'object') return;
    var kv = snapshot.kv || {};

    renderOverview(kv);
    var channels = kv.channels || {};
    CHANNELS.forEach(function (ch) {
      renderChannel(ch, channels[ch]);
    });
    setText('updated', '更新于 ' + fmtTime(snapshot.generatedAt || kv.generated_at));
  }

  // craft Pages 协议：宿主经 postMessage 注入 init/data（protocol craft-pages/v1）
  window.addEventListener('message', function (event) {
    var msg = event.data;
    if (!msg || msg.protocol !== 'craft-pages/v1') return;
    document.body.classList.add('in-host');
    if (msg.type === 'init' && msg.payload && msg.payload.snapshot) {
      applySnapshot(msg.payload.snapshot);
    } else if (msg.type === 'data' && msg.payload) {
      applySnapshot(msg.payload.snapshot);
    }
  });

  // 保守兼容：直接以全局变量注入时也可渲染（本地开发 / 纯浏览器打开）
  if (window.__PAGE_SNAPSHOT__) applySnapshot(window.__PAGE_SNAPSHOT__);
})();
</script>
</body>
</html>
