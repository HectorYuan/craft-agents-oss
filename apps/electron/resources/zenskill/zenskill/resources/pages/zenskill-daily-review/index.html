<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日复盘</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-2: #6b7280;
    --muted: #9ca3af;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.10);
    --accent-fill: rgba(124, 92, 255, 0.18);
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --gold: #d97706;
    --gold-soft: rgba(217, 119, 6, 0.10);
    --gold-border: rgba(217, 119, 6, 0.32);
    --ring-track: #e9ebef;
    --cell-off: #e9ebef;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    --rel-prerequisite: #d97706;
    --rel-complementary: #16a34a;
    --rel-competing: #dc2626;
    --rel-transfer: #9333ea;
    --rel-co-occurrence: #2563eb;
    --cat-coding: #2563eb;
    --cat-writing: #9333ea;
    --cat-analysis: #16a34a;
    --cat-learning: #d97706;
    --cat-productivity: #0d9488;
    --cat-communication: #ea580c;
    --cat-general: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d24;
      --card: #232730;
      --border: #333845;
      --text: #e5e7eb;
      --text-2: #9ca3af;
      --muted: #6b7280;
      --accent: #8b7cff;
      --accent-soft: rgba(139, 124, 255, 0.16);
      --accent-fill: rgba(139, 124, 255, 0.25);
      --good: #9ece6a;
      --warn: #e0af68;
      --bad: #f7768e;
      --gold: #e0af68;
      --gold-soft: rgba(224, 175, 104, 0.12);
      --gold-border: rgba(224, 175, 104, 0.35);
      --ring-track: #333845;
      --cell-off: #2d3240;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.20);
      --rel-prerequisite: #e0af68;
      --rel-complementary: #9ece6a;
      --rel-competing: #f7768e;
      --rel-transfer: #bb9af7;
      --rel-co-occurrence: #7aa2f7;
      --cat-coding: #7aa2f7;
      --cat-writing: #bb9af7;
      --cat-analysis: #9ece6a;
      --cat-learning: #e0af68;
      --cat-productivity: #4fd6be;
      --cat-communication: #ff9e64;
      --cat-general: #7c8598;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 20px;
    min-height: 100vh;
  }
  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  /* 宿主顶栏已有页名，托管渲染时隐藏页内大标题 */
  .in-host .header h1 { display: none; }
  .updated { font-size: 12px; color: var(--text-2); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .card.wide { grid-column: 1 / -1; }
  .review-message { font-size: 14px; line-height: 1.7; }
  .mood { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .ring-track { stroke: var(--ring-track); }
  .ring-pct { fill: var(--text); }
  .ring-wrap { display: flex; align-items: center; gap: 16px; }
  .ring-label { font-size: 20px; font-weight: 600; color: var(--text); }
  .ring-level { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .stats { display: flex; flex-direction: column; gap: 12px; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .num.zero { color: var(--good); }
  .stat .lbl { font-size: 12px; color: var(--text-2); }
  .spark { display: flex; align-items: flex-end; gap: 6px; height: 56px; margin-top: 10px; }
  .spark .bar {
    flex: 1; min-height: 3px;
    background: var(--accent-fill);
    border-radius: 3px 3px 0 0;
    position: relative;
  }
  .achv-list { display: flex; flex-direction: column; gap: 8px; }
  .achv { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .achv .icon { font-size: 18px; }
  .footer {
    margin-top: 16px; text-align: center;
    font-size: 11px; color: var(--muted);
  }
  /* 空态：图标 + 一句话 + 数据来源提示 */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 20px 12px; text-align: center;
  }
  .empty .empty-icon { font-size: 24px; line-height: 1; color: var(--muted); }
  .empty .empty-msg { font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .empty .empty-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="header">
    <h1>每日复盘</h1>
    <span class="updated" id="updated"></span>
  </div>

  <div class="grid">
    <div class="card wide">
      <h2>今日复盘</h2>
      <div class="review-message" id="review-message">等待数据…</div>
      <div class="mood" id="mood"></div>
    </div>

    <div class="card">
      <h2>能量</h2>
      <div class="ring-wrap">
        <svg width="84" height="84" viewBox="0 0 84 84" id="ring">
          <circle class="ring-track" cx="42" cy="42" r="34" fill="none" stroke-width="9"></circle>
          <circle id="ring-fg" cx="42" cy="42" r="34" fill="none"
                  stroke-width="9" stroke-linecap="round"
                  transform="rotate(-90 42 42)"
                  stroke-dasharray="0 999"></circle>
          <text id="ring-pct" class="ring-pct" x="42" y="47" text-anchor="middle"
                font-size="17" font-weight="600">--</text>
        </svg>
        <div>
          <div class="ring-label" id="energy-level">--</div>
          <div class="ring-level" id="energy-sub">能量状态</div>
        </div>
      </div>
      <div class="spark" id="spark"></div>
    </div>

    <div class="card">
      <h2>待办与收件箱</h2>
      <div class="stats">
        <div class="stat">
          <span class="num" id="pending-actions">-</span>
          <span class="lbl">待办行动</span>
        </div>
        <div class="stat">
          <span class="num" id="inbox-pending">-</span>
          <span class="lbl">收件箱待处理</span>
        </div>
      </div>
    </div>

    <div class="card wide">
      <h2>最近成就</h2>
      <div class="achv-list" id="achievements">
        <div class="empty"><div class="empty-msg">等待数据…</div></div>
      </div>
    </div>
  </div>

  <div class="footer">ZenSkill · 每日 07:00 自动刷新</div>

<script>
(function () {
  'use strict';

  // lucide 图标内联数据（stroke currentColor 1.75，path 数据取自 lucide）
  var ICON_PATHS = {
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    'trending-up': '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
    medal: '<path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/>'
  };

  function icon(name, size) {
    size = size || 20;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block">' + (ICON_PATHS[name] || '') + '</svg>';
  }

  var LEVEL_TEXT = {
    high: '精力充沛', medium: '状态不错', low: '能量偏低', critical: '需要休息'
  };

  function cssVar(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return (v || '').trim();
  }

  function showEmpty(container, iconName, message, hint) {
    container.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'empty';
    var ic = document.createElement('div');
    ic.className = 'empty-icon';
    ic.innerHTML = icon(iconName || 'inbox', 24);
    var msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = message || '暂无数据';
    el.appendChild(ic);
    el.appendChild(msg);
    if (hint) {
      var hp = document.createElement('div');
      hp.className = 'empty-hint';
      hp.textContent = hint;
      el.appendChild(hp);
    }
    container.appendChild(el);
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text == null ? '-' : String(text);
  }

  function renderRing(pct) {
    var r = 34, c = 2 * Math.PI * r;
    var ring = document.getElementById('ring-fg');
    var shown = (pct == null) ? 0 : Math.max(0, Math.min(100, pct));
    ring.setAttribute('stroke-dasharray', (shown / 100 * c).toFixed(1) + ' ' + c.toFixed(1));
    var color = pct == null ? cssVar('--accent') :
      (pct >= 70 ? cssVar('--good') : pct >= 40 ? cssVar('--accent') :
        pct >= 15 ? cssVar('--warn') : cssVar('--bad'));
    ring.setAttribute('stroke', color);
    setText('ring-pct', pct == null ? '--' : Math.round(pct) + '%');
  }

  function renderSpark(points) {
    var wrap = document.getElementById('spark');
    wrap.innerHTML = '';
    if (!points || !points.length) {
      showEmpty(wrap, 'trending-up', '暂无能量历史', '能量记录随每日复盘累积');
      return;
    }
    points.slice(-7).forEach(function (p) {
      var bar = document.createElement('div');
      bar.className = 'bar';
      var h = Math.max(3, Math.round((p.v / 100) * 56));
      bar.style.height = h + 'px';
      bar.title = new Date(p.t).toLocaleDateString('zh-CN') + '：' + p.v + '%';
      wrap.appendChild(bar);
    });
  }

  function renderAchievements(items) {
    var box = document.getElementById('achievements');
    box.innerHTML = '';
    if (!items || !items.length) {
      showEmpty(box, 'medal', '最近 24 小时内没有新解锁的成就', '成就由使用行为自动解锁');
      return;
    }
    items.forEach(function (a) {
      var row = document.createElement('div');
      row.className = 'achv';
      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = a.icon || '🏅';
      var title = document.createElement('span');
      title.textContent = a.title || '';
      row.appendChild(icon);
      row.appendChild(title);
      box.appendChild(row);
    });
  }

  function fmtTime(ms) {
    try {
      var d = new Date(ms);
      return d.toLocaleDateString('zh-CN') + ' ' +
        d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function applySnapshot(snapshot) {
    if (!snapshot || typeof snapshot !== 'object') return;
    var kv = snapshot.kv || {};
    setText('review-message', kv.review_message || '暂无复盘数据');
    setText('mood', kv.companion_mood || '');
    renderRing(typeof kv.energy_pct === 'number' ? kv.energy_pct : null);
    setText('energy-level', LEVEL_TEXT[kv.energy_level] || kv.energy_level || '--');
    setText('energy-sub', '能量状态');
    setText('pending-actions', kv.pending_actions);
    setText('inbox-pending', kv.inbox_pending);
    renderAchievements(kv.achievements_new);
    renderSpark((snapshot.series || {}).energy_history);
    setText('updated', '更新于 ' + fmtTime(snapshot.generatedAt || kv.generated_at));
  }

  // craft Pages 协议：宿主经 postMessage 注入 init/data（protocol craft-pages/v1）
  window.addEventListener('message', function (event) {
    var msg = event.data;
    if (!msg || msg.protocol !== 'craft-pages/v1') return;
    document.body.classList.add('in-host');
    if (msg.type === 'init' && msg.payload && msg.payload.snapshot) {
      applySnapshot(msg.payload.snapshot);
    } else if (msg.type === 'data' && msg.payload) {
      applySnapshot(msg.payload.snapshot);
    }
  });

  // 保守兼容：直接以全局变量注入时也可渲染（本地开发 / 纯浏览器打开）
  if (window.__PAGE_SNAPSHOT__) applySnapshot(window.__PAGE_SNAPSHOT__);
})();
</script>
</body>
</html>
