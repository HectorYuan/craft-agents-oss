[project]
name = "zenskill"
version = "2.6.3"
description = "有生命的技能系统 - 记忆、成长、自我反思"
authors = [{name = "ZenSkill Team"}]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
]

[project.scripts]
zenskill = "zenskill.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]
tui = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zenskill", "zenthink"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "e2e: E2E 场景测试（完整用户流程）",
    "skill: 技能生态测试（包格式/兼容/沙箱）",
    "platform: 平台适配器测试（契约/隔离）",
    "security: 安全审计测试（注入/泄漏/CVE）",
]

[tool.coverage.run]
source = ["zenskill"]
omit = [
    "zenskill/zenomni/*",
    "zenskill/wrapper/*",
    "zenskill/platforms/*",
]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def _text\\(.*\\):",
    "if __name__ == .__main__.:",
    "except Exception",
    "raise NotImplementedError",
]
fail_under = 35

[tool.mypy]
python_version = "3.12"
check_unchecked_defs = true
warn_return_any = true
warn_unused_configs = true
files = [
    "zenskill/core/paths.py",
    "zenskill/systems/memory/",
]
